name: Build and Deploy AUDI CARTOONZ PRINT

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_JSON=$(find extracted -name package.json -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "package.json not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Correct Vite configuration
        run: |
          cat > vite.config.ts <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";

          export default defineConfig({
            base: "/AUDI_CARTOONZ_PRINT_OLD/",
            plugins: [react()],
          });
          EOF
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Add Vite environment types
        run: |
          printf '/// <reference types="vite/client" />\n' > src/vite-env.d.ts
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build project
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
